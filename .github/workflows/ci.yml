name: CI

# push は main だけをトリガーにする（feature branchへのpushはpull_requestイベントで既にCIが走るため、
# 両方を対象にすると同一コミットに対してCIが2回丸ごと走り、待ち時間が単純に倍になっていた。
# 2026-08-01 マスター指摘で発覚・修正）。
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect change scope
    runs-on: ubuntu-latest
    outputs:
      behavior: ${{ steps.filter.outputs.behavior }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: JS・演出・e2e関連のファイルが変わっているか確認
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 差分の基準が取れない場合（新規ブランチ・force-push直後等）は安全側に倒してtrueにする。
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "behavior=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(site/assets/js/|site/index\.html$|tests/e2e/|playwright\.config\.mjs$|site/assets/vendor/)'; then
            echo "behavior=true" >> "$GITHUB_OUTPUT"
          else
            echo "behavior=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: references / lint / unit / audit / roadmap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check internal references
        run: pnpm run verify:references

      - name: Check Lottie contract
        run: pnpm run verify:lottie

      - name: Check asset version consistency
        run: pnpm run verify:asset-version

      - name: Check i18n parity
        run: pnpm run verify:i18n

      - name: Lint HTML, CSS, and JavaScript
        run: pnpm run lint

      - name: Run Node unit tests
        run: pnpm run test:unit

      - name: Audit dependencies
        run: pnpm run audit

      - name: Verify roadmap evidence
        run: pnpm run verify:roadmap

  browser:
    name: Playwright / axe
    needs: changes
    # 文言・スタイルだけの変更ではJS/演出は壊れようがないため、対象ファイルが変わったときだけ走らせる
    # （e2e約5分・a11y約1.5分はCIの待ち時間の大半を占めていたため、2026-08-01 マスター指摘で必須から外した）。
    # ci-green（下のgate）はこのjobの結果を待たない＝マージの必須条件ではない。
    if: needs.changes.outputs.behavior == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm run test:e2e

      - name: Run accessibility tests
        run: pnpm run test:a11y

      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: ci-green
    # ci-green が待つのは quality（数秒〜数十秒で終わる機械検証）だけ。browser(e2e/a11y)は
    # 該当ファイルが変わったときだけ参考として走るが、マージの必須条件にはしない
    # （2026-08-01 マスター指摘：一文・一単語の変更を軽く速くできることを優先する）。
    needs: [quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the quality job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ]; then
            echo "ci-green: FAIL (quality=$QUALITY_RESULT)"
            exit 1
          fi
          echo "ci-green: OK"
