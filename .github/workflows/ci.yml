name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: references / lint / unit / audit / roadmap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check internal references
        run: pnpm run verify:references

      - name: Check Lottie contract
        run: pnpm run verify:lottie

      - name: Lint HTML, CSS, and JavaScript
        run: pnpm run lint

      - name: Run Node unit tests
        run: pnpm run test:unit

      - name: Audit dependencies
        run: pnpm run audit

      - name: Verify roadmap evidence
        run: pnpm run verify:roadmap

  browser:
    name: Playwright / axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm run test:e2e

      - name: Run accessibility tests
        run: pnpm run test:a11y

      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: ci-green
    needs: [quality, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ] || [ "$BROWSER_RESULT" != "success" ]; then
            echo "ci-green: FAIL (quality=$QUALITY_RESULT browser=$BROWSER_RESULT)"
            exit 1
          fi
          echo "ci-green: OK"
